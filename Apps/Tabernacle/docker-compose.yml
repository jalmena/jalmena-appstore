# Tabernacle — your sacred repository of guitar tabs.
#
# This file is the store's, not the project's. The project's own compose.yaml
# mounts ./data and is meant for `docker compose up -d` in a checkout; this one
# mounts the path CasaOS creates and carries the metadata the store protocol
# asks for. Two audiences, two files.
#
# Everything shown to whoever installs is English only. CasaOS falls back to
# en_us when it has no entry for the reader's language, so one language here
# means one language on every machine, rather than a card that is Spanish in
# one place and English in another.
name: tabernacle

services:
  tabernacle:
    image: ghcr.io/jalmena/tabernacle:0.5.0
    container_name: tabernacle
    restart: unless-stopped

    ports:
      # 8440 on the host because A440 is the note everything tunes to, and
      # because nothing else claims it: no app in the CasaOS store or the
      # BigBear store publishes it, and IANA has it unassigned. Inside the
      # container Tabernacle listens on 8080 and always will.
      - target: 8080
        published: "8440"
        protocol: tcp

    volumes:
      # Everything Tabernacle owns lives here: songs/, trash/ and the index.
      # The songs stay plain .song text files, so backing up is copying this
      # directory and nothing else.
      - /DATA/AppData/tabernacle/data:/data

    environment:
      # Set these to whoever owns the directory above. On a NAS this is usually
      # the difference between a working install and a permissions error.
      PUID: "1000"
      PGID: "1000"
      TZ: UTC
      # The interface language for anybody who has not chosen one. Nineteen are
      # available, and each person can pick their own once they have an account.
      TABERNACLE_LANG: en

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    # CasaOS reads this to label each field in the install dialog. Without it the
    # dialog shows the raw variable names, which say nothing to whoever installs.
    x-casaos:
      envs:
        - container: PUID
          description:
            en_us: User id that owns the data directory. Run `id -u` on the host to find it.
        - container: PGID
          description:
            en_us: Group id that owns the data directory. Run `id -g` on the host to find it.
        - container: TZ
          description:
            en_us: Time zone, used for the dates shown on songs.
        - container: TABERNACLE_LANG
          description:
            en_us: Interface language for anybody who has not chosen one. One of es, en, ca, gl, eu, pt, fr, it, de, nl, pl, ru, tr, id, zh, ja, ko, hi, ar.
      ports:
        - container: "8080"
          description:
            en_us: Web interface.
      volumes:
        - container: /data
          description:
            en_us: Songs, deleted songs and the index. Back this up and you have backed up everything.

# Locale keys are lowercase on purpose. CasaOS looks up en_us literally, and the
# v2 build normalises lowercase to en_US on its way into index.json, so one
# spelling serves both. Asset URLs are absolute for the same kind of reason: a
# v2 build resolves a bare filename against its base URL, and CasaOS, reading
# this file straight out of the archive, has no base URL to resolve against.
x-casaos:
  id: io.github.jalmena.tabernacle
  main: tabernacle
  index: /
  port_map: "8440"
  scheme: http
  icon: https://raw.githubusercontent.com/jalmena/tabernacle-appstore/main/Apps/Tabernacle/icon.svg
  thumbnail: https://raw.githubusercontent.com/jalmena/tabernacle-appstore/main/Apps/Tabernacle/thumbnail.png
  screenshot_link:
    - https://raw.githubusercontent.com/jalmena/tabernacle-appstore/main/Apps/Tabernacle/screenshot-1.png
    - https://raw.githubusercontent.com/jalmena/tabernacle-appstore/main/Apps/Tabernacle/screenshot-2.png
    - https://raw.githubusercontent.com/jalmena/tabernacle-appstore/main/Apps/Tabernacle/screenshot-3.png
  author: jalmena
  developer: jalmena
  category: Media
  architectures:
    - amd64
    - arm64
  version: "0.5.0"
  update_at: "2026-08-24"
  website: https://github.com/jalmena/tabernacle
  repo: https://github.com/jalmena/tabernacle
  support: https://github.com/jalmena/tabernacle/issues
  docs: https://github.com/jalmena/tabernacle/blob/main/README.md

  title:
    en_us: Tabernacle

  tagline:
    en_us: Your sacred repository of guitar tabs

  description:
    en_us: |
      A self-hosted guitar songbook. Your songs are plain .song text files in a directory you own — back them up, edit them by hand, put them in git. The database is only an index and can be deleted at any time; it rebuilds from the files.

      Transpose a sheet and the tablature moves with it. Click any chord to see how it is held, with alternative shapes. Open the Chords section to draw a shape on a fretboard and be told what chord it is, or name a chord and see every way of playing it, easiest first. Print a real A4 sheet, or pick any set of songs and print them as one songbook.

      Press Play and the sheet scrolls itself, big enough to read from a stand, so your hands can stay on the guitar. A song full of barre chords is told where to put a capo so it is not: same sound, easier shapes.

      Reading needs no account. Changing anything does, once you have made one. Nineteen interface languages, note names as C-D-E or Do-Re-Mi, and a light or dark theme, all chosen per person.

      Works offline, sends nothing anywhere, has no telemetry. Tabernacle manages music you provide; it does not supply, license or distribute any musical work, and it does not download anything from anywhere.

  tips:
    before_install:
      en_us: |
        Set PUID and PGID to the owner of /DATA/AppData/tabernacle/data, or the container may not be able to write to it. On the host, `id -u` and `id -g` will tell you.

        Put your .song files in data/songs as Artist/Title.song, or import them from the web interface. Reading needs no account; press Sign in to claim the instance and create the first administrator.

  release_notes:
    en_us: |
      Play mode scrolls a sheet by itself while your hands are on the guitar, and Tabernacle now says where to put a capo so a barred song becomes open chords.
